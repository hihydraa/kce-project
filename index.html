<body class="bg-gray-100">

    </div>

    <!-- Step 1: Job Selection -->
    <div id="step-select" class="hidden">
      <h2 class="text-xl font-bold text-gray-800 mb-1">เลือกงานที่ต้องการทำ</h2>
      <p class="text-sm text-gray-500 mb-4">แสดงเฉพาะงานปรับปรุงปั๊มและงานซ่อมที่ยังไม่เสร็จสิ้น</p>

            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

    <!-- Step 2: Day Configuration (per branch, one at a time) -->
    <div id="step-days" class="hidden pb-24">
      <div class="flex items-center mb-4 pb-2 border-b border-gray-100">

        </button>
        <h2 class="text-xl font-bold text-gray-800">กำหนดจำนวนวัน</h2>

      <p class="text-sm text-gray-600 mb-5 bg-blue-50 p-3 rounded-lg border border-blue-100">
        ระบุจำนวนวันที่จะลงพื้นที่ในแต่ละสาขา แล้วระบบจะแบ่งเส้นทางของแต่ละวันให้อัตโนมัติ
      </p>
      <div id="branch-step-container"></div>

      <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t z-50 flex justify-center pointer-events-none">
        <div class="max-w-md w-full pointer-events-auto">
          <button onclick="daysNext()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex justify-center items-center">
            <span id="days-btn-label">ต่อไป</span>
            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </button>

    <!-- Step 3: Generated Trip -->
    <div id="step-trip" class="hidden">
      <div class="flex items-center justify-between mb-4 border-b pb-3 border-gray-200">
        <h2 class="text-xl font-bold text-gray-800">แผนงานของคุณ</h2>
        <button onclick="goToStepDays()" class="text-sm text-red-600 border border-red-200 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          ปรับแผนงานใหม่
        </button>
      </div>

        <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span id="trip-warning-text"></span>
      </div>
      <div id="trip-branches-tabs" class="flex flex-wrap gap-2 mb-5"></div>
      <div id="trip-days-container" class="space-y-4"></div>
    </div>

    <!-- Step 4: Execution View (Day Detail) -->
    <div id="step-execution" class="hidden relative pb-10"></div>
  </div>
</div>

<script>
const SHEET_ID = "1mpy2nobQMqhLYWIem2dom74Ow2h8v-UFiqbJHZQ4IDk";
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzEJhR_nH9FO8BVFfdTPoSGgujpG7hVPPbPWQQLwLumRUb6Wwz4BqG1797vLR056FZ9/exec";

const START_POINTS = {
  ST: { name: "สามทองบริการ", lat: 16.381126, lng: 103.348786, bu: "ST" },
  KN: { name: "เค.ซี.ปิโตรเลียม2006", lat: 16.716021, lng: 103.082049, bu: "KN" },
  MUK: { name: "เค.ซี.จี.ปิโตรเลียม", lat: 16.435929, lng: 104.616261, bu: "MUK" },
  WNN: { name: "เค.ซี. กรีน เอ็นเนอร์จี", lat: 17.629400, lng: 103.767589, bu: "WNN" }
};

/* Prefix ของรหัสลูกค้า -> สาขา (BU) */
const CODE_PREFIX_BU_MAP = [
  ['ST', 'ST'],
  ['KN', 'KN'],
  ['MUK', 'MUK'], ['MK', 'MUK'], ['KCG', 'MUK'],
  ['WNN', 'WNN'], ['WN', 'WNN']
];

const MAX_ROUTE_CUSTOMER_STOPS = 9;

let allJobs = [];
let selectedJobs = [];
let branchQueue = [];      // ordered list of branch codes to configure
let branchCursor = 0;      // current index in branchQueue
let branchDaysConfig = {}; // { bu: days }
let tripPlan = {};         // { bu: [ [day0Jobs], [day1Jobs], ... ] }
let leafletMap = null;
let currentTripId = "";

/* ===== Helpers ===== */
function cleanText(v) { return String(v ?? "").trim(); }
function norm(v) { return cleanText(v).toLowerCase().replace(/\s+/g, " "); }
function toNumber(v) {
  const s = cleanText(v).replace(/,/g, "");
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

/* ===== Status (สถานะ) filtering: only open / not-done jobs pass ===== */
const NOT_DONE_MARKERS = ['ยังไม่', 'ไม่เสร็จ', 'ไม่สำเร็จ', 'รอ', 'ค้าง'];
const DONE_MARKERS = ['เสร็จสิ้น', 'เสร็จแล้ว', 'เสร็จ', 'ปิดงาน', 'ปิดเคส', 'สำเร็จ', 'done', 'complete', 'completed', 'closed'];
function isJobDone(status) {
  if (!status) return false;
  const s = cleanText(status).toLowerCase();
  for (const m of NOT_DONE_MARKERS) if (s.includes(m)) return false;
  for (const m of DONE_MARKERS) if (s.includes(m)) return true;
  return false;
}

/* ===== Derive branch (BU) from customer code prefix or nearest base ===== */
function deriveBU(code, lat, lng) {
  if (code) {
    const c = code.toUpperCase();
    for (const [p, b] of CODE_PREFIX_BU_MAP) if (c.startsWith(p)) return b;
  }
  let best = 'ST', bestD = Infinity;
  for (const bu in START_POINTS) {
    const sp = START_POINTS[bu];
    const d = haversine(lat, lng, sp.lat, sp.lng);
    if (d < bestD) { bestD = d; best = bu; }
  }
  return best;
}

/* ===== Fetch sheet with correct headers (from json.table.cols) ===== */
async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`โหลดชีต ${sheetName} ไม่ได้`);
  const text = await res.text();
  const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const json = JSON.parse(jsonText);
  if (!json.table || json.status && json.status !== 'ok') {
    throw new Error(`ข้อมูลชีต ${sheetName} ผิดปกติ (status: ${json.status || 'no table'})`);
  }
  const headers = (json.table.cols || []).map(c => cleanText(c.label || c.id || ''));
  const rows = (json.table.rows || []).map(r => (r.c || []).map(c => {
    if (!c) return "";
    if (c.f !== undefined && c.f !== null && cleanText(c.f) !== "") return c.f;
    if (c.v !== undefined && c.v !== null) return c.v;
    return "";
  }));
  return { headers, rows };
}

function findCol(headers, aliases) {
  for (const a of aliases) {
    const idx = headers.indexOf(a);
    if (idx !== -1) return idx;
  }
  return -1;
}

/* ===== Parse jobs from a sheet into unified job objects ===== */
function parseJobs(sheetData, type) {
  const { headers, rows } = sheetData;
  const nameCol   = findCol(headers, ['รายชื่อลูกค้า', 'ชื่อปั๊ม', 'ชื่อลูกค้า', 'ชื่อลูกค้า/ชื่อปั๊ม', 'ชื่อลูกค้า / ชื่อปั๊ม', 'ชื่อ']);
  const codeCol   = findCol(headers, ['รหัสลูกค้า', 'รหัสปั๊ม', 'รหัส', 'customer']);
  const statusCol = findCol(headers, ['สถานะ', 'ความคืบหน้า', 'สถานะงาน', 'status']);
  const latCol    = findCol(headers, ['ละ', 'ละติจูด', 'latitude', 'lat']);
  const lngCol    = findCol(headers, ['ลอง', 'ลองจิจูด', 'longitude', 'lng', 'lon', 'long']);
  const meterCol  = findCol(headers, ['มิเตอร์สาย', 'สายมิเตอร์', 'มิเตอร์']);
  const areaCol   = findCol(headers, ['เขตพื้นที่', 'พื้นที่']);

  const jobs = [];
  rows.forEach((r, i) => {
    const code   = codeCol >= 0 ? cleanText(r[codeCol]) : '';
    const name   = nameCol >= 0 ? cleanText(r[nameCol]) : '';
    const status = statusCol >= 0 ? cleanText(r[statusCol]) : '';
    const lat    = latCol >= 0 ? toNumber(r[latCol]) : null;
    const lng    = lngCol >= 0 ? toNumber(r[lngCol]) : null;

    if (lat === null || lng === null) return; // ต้องมีพิกัด
    if (isJobDone(status)) return;            // แสดงเฉพาะงานที่ยังไม่เสร็จ

    const bu = deriveBU(code, lat, lng);
    const hasCode = !!code;
    const id = code ? code : `${type}-${i}`;   // repair jobs have no customer code -> unique generated id
    const info = meterCol >= 0 ? cleanText(r[meterCol]) : (areaCol >= 0 ? cleanText(r[areaCol]) : '');

    jobs.push({
      id, name: name || 'ไม่ระบุชื่อ', branch: bu, lat, lng, type,
      status: status || 'รอดำเนินการ', info, done: false, hasCode
    });
  });
  return jobs;
}

/* ===== Load all jobs ===== */
async function loadData(force = false) {
  document.getElementById('loading').classList.remove('hidden');
  ['step-select', 'step-days', 'step-trip', 'step-execution'].forEach(id => document.getElementById(id).classList.add('hidden'));
  try {
    const [pump, repair] = await Promise.all([
      fetchSheet("ตารางปรับปรุงปั๊ม"),
      fetchSheet("ตารางซ่อม")
    ]);
    const pumps = parseJobs(pump, "ปรับปรุงปั๊ม");
    const repairs = parseJobs(repair, "ซ่อม");
    allJobs = [...pumps, ...repairs];
    renderJobSelection();
  } catch (err) {
    alert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message);
    document.getElementById('job-list-container').innerHTML =
      `<div class="text-center py-8 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">${err.message}</div>`;
    document.getElementById('step-select').classList.remove('hidden');
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

/* ===== Step 1: Job selection ===== */
function renderJobSelection() {
  document.getElementById('step-select').classList.remove('hidden');
  document.getElementById('step-select').style.paddingBottom = "80px";

  const container = document.getElementById('job-list-container');
  container.innerHTML = '';

  const byBranch = { ST: [], KN: [], MUK: [], WNN: [] };
  allJobs.forEach(j => { if (byBranch[j.branch]) byBranch[j.branch].push(j); });

  let hasAnyJob = false;
  for (const [bu, jobs] of Object.entries(byBranch)) {
    if (jobs.length === 0) continue;
    hasAnyJob = true;
    const branchName = START_POINTS[bu].name;
    const typeCounts = { 'ปรับปรุงปั๊ม': 0, 'ซ่อม': 0 };
    jobs.forEach(j => typeCounts[j.type]++);

    const section = document.createElement('div');
    section.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-200';
    section.innerHTML = `
      <div class="flex justify-between items-center mb-3 border-b pb-2">
        <div>
          <h3 class="font-bold text-blue-800 text-lg flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            สาขา ${bu}
          </h3>
          <div class="text-xs text-gray-500 mt-1">${branchName} • ปรับปรุง ${typeCounts['ปรับปรุงปั๊ม']} / ซ่อม ${typeCounts['ซ่อม']}</div>
        </div>
        <label class="flex items-center space-x-2 bg-blue-50 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition-colors">
          <span class="text-sm font-semibold text-blue-700">เลือกทั้งหมด</span>
          <input type="checkbox" class="w-5 h-5 text-blue-600 rounded" onchange="toggleBranch('${bu}', this.checked)">
        </label>
      </div>
      <div class="space-y-3" id="list-${bu}">
        ${jobs.map(j => `
          <label class="flex items-start space-x-3 p-3 bg-gray-50 hover:bg-blue-50 rounded-lg border border-gray-100 cursor-pointer transition-colors">
            <input type="checkbox" data-id="${j.id}" class="w-5 h-5 mt-0.5 text-blue-600 rounded job-cb" onchange="updateSelection()">
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-gray-800 text-sm leading-tight mb-1">${j.name}</div>
              <div class="flex items-center flex-wrap gap-1 text-xs">
                <span class="px-2 py-0.5 rounded font-medium ${j.type === 'ซ่อม' ? 'bg-orange-100 text-orange-800' : 'bg-green-100 text-green-800'}">${j.type}</span>
                ${j.hasCode ? `<span class="text-gray-400">${j.id}</span>` : (j.info ? `<span class="text-gray-500">${j.info}</span>` : '')}
              </div>
              <div class="text-[11px] text-gray-400 mt-1">${j.status}</div>
            </div>
          </label>
        `).join('')}
      </div>
    `;
    container.appendChild(section);
  }

  if (!hasAnyJob) {
    container.innerHTML = `<div class="text-center py-10 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">
      <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      ไม่พบงานที่ยังไม่เสร็จสิ้นในระบบ (หรือข้อมูลงานยังไม่มีพิกัด)</div>`;
  }
  updateSelection();
}

function toggleBranch(bu, checked) {
  const container = document.getElementById(`list-${bu}`);
  if (!container) return;
  container.querySelectorAll('.job-cb').forEach(cb => cb.checked = checked);
  updateSelection();
}

function updateSelection() {
  const cbs = document.querySelectorAll('.job-cb:checked');
  const count = cbs.length;
  document.getElementById('selected-count').innerText = count;
  document.getElementById('btn-next').disabled = count === 0;
  selectedJobs = Array.from(cbs).map(cb => allJobs.find(j => String(j.id) === String(cb.dataset.id)));
}

/* ===== Step 2: Branch day wizard ===== */
function goToStepDays() {
  if (selectedJobs.length === 0) return;
  const branches = [...new Set(selectedJobs.map(j => j.branch))];
  // Order: ST first then others alphabetically/listed
  const order = ['ST', 'KN', 'MUK', 'WNN'];
  branchQueue = order.filter(b => branches.includes(b)).concat(branches.filter(b => !order.includes(b)));
  branchCursor = 0;
  branchDaysConfig = {};
  document.getElementById('step-select').classList.add('hidden');
  document.getElementById('step-trip').classList.add('hidden');
  document.getElementById('step-days').classList.remove('hidden');
  renderBranchStep();
}

function goToStepSelect() {
  document.getElementById('step-days').classList.add('hidden');
  document.getElementById('step-select').classList.remove('hidden');
}

function renderBranchStep() {
  const bu = branchQueue[branchCursor];
  const count = selectedJobs.filter(j => j.branch === bu).length;
  const branchName = START_POINTS[bu].name;
  const defaultDays = bu === 'ST' ? 1 : 2;
  const suggestedDays = branchDaysConfig[bu] || Math.max(defaultDays, Math.ceil(count / MAX_ROUTE_CUSTOMER_STOPS));

  // Back button label: if cursor>0 -> previous branch, else back to selection
  const backBtn = document.getElementById('days-back');
  backBtn.onclick = daysBack;

  const container = document.getElementById('branch-step-container');
  container.innerHTML = `
    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
      <div class="flex items-center mb-4">
        <div class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm mr-3">${bu}</div>
        <div>
          <h3 class="font-bold text-gray-800 text-lg leading-tight">สาขา ${bu}</h3>
          <p class="text-xs text-gray-500">${branchName}</p>
        </div>
      </div>

      ${branchQueue.length > 1 ? `

function updateDaysBtnLabel() {
  const bu = branchQueue[branchCursor];
  const isLast = branchCursor === branchQueue.length - 1;
  document.getElementById('days-btn-label').innerText = isLast ? 'สร้างแผนงานทริป' : 'ต่อไป';
}

function changeDays(bu, delta) {
  const input = document.getElementById(`days-${bu}`);
  let val = (parseInt(input.value) || 1) + delta;
  if (val < 1) val = 1;
  if (val > 14) val = 14;
  input.value = val;
}

function daysBack() {
  if (branchCursor > 0) {
    // clear current day config before going back
    // keep previous branch's config
    branchCursor--;
    renderBranchStep();
  } else {
    goToStepSelect();
  }
}

function daysNext() {
  const bu = branchQueue[branchCursor];
  const val = parseInt(document.getElementById(`days-${bu}`).value) || 1;
  branchDaysConfig[bu] = val;
  if (branchCursor < branchQueue.length - 1) {
    branchCursor++;
    renderBranchStep();
  } else {
    generateTrip();
  }
}

/* ===== Step 3: Generate trip ===== */
function generateTrip() {
  const btn = document.querySelector('#step-days .fixed button');
  const origHtml = btn.innerHTML;
  btn.innerHTML = `<div class="animate-spin h-5 w-5 border-b-2 border-white rounded-full mr-2"></div> กำลังประมวลผลเส้นทาง...`;
  btn.disabled = true;

  setTimeout(() => {
    tripPlan = {};
    const d = new Date();
    currentTripId = `KCE-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;

    branchQueue.forEach(bu => {
      const jobs = selectedJobs.filter(j => j.branch === bu);
      const days = Math.max(1, branchDaysConfig[bu] || 1);
      const start = START_POINTS[bu] || START_POINTS.ST;

      // Spatial clustering: sort by angle around branch base, then chunk into contiguous groups
      jobs.forEach(j => {
        j._angle = Math.atan2(j.lat - start.lat, j.lng - start.lng);
        j._dist = haversine(start.lat, start.lng, j.lat, j.lng);
      });
      jobs.sort((a, b) => a._angle - b._angle);

      // Distribute jobs as evenly as possible by max load (limit per day)
      const chunks = [];
      const baseLoad = Math.max(1, Math.ceil(jobs.length / days));
      for (let di = 0; di < days; di++) {
        const slice = jobs.slice(di * baseLoad, (di + 1) * baseLoad);
        if (slice.length > 0) {
          // Within a day, order by nearest neighbor from branch base
          chunks.push(orderDayRoute(slice, start));
        }
      }
      tripPlan[bu] = chunks;
    });

    btn.innerHTML = origHtml;
    btn.disabled = false;
    renderTripPlan();
  }, 60);
}

/* Nearest-neighbor ordering from a starting point (closed circular route) */
function orderDayRoute(jobs, start) {
  const route = [];
  const remaining = jobs.map(j => ({ j, visited: false }));
  let cur = start;
  while (remaining.some(x => !x.visited)) {
    let best = null, bestD = Infinity;
    for (const x of remaining) {
      if (x.visited) continue;
      const dd = haversine(cur.lat, cur.lng, x.j.lat, x.j.lng);
      if (dd < bestD) { bestD = dd; best = x; }
    }
    best.visited = true;
    route.push(best.j);
    cur = best.j;
  }
  return route;
}

  document.getElementById('step-days').classList.add('hidden');
  document.getElementById('step-trip').classList.remove('hidden');
  window.scrollTo(0, 0);

  const branches = Object.keys(tripPlan);
  const tabsContainer = document.getElementById('trip-branches-tabs');

  if (branches.length > 1) {
    tabsContainer.style.display = 'flex';
    tabsContainer.innerHTML = branches.map(bu => `
      <button onclick="showTripBranch('${bu}')" id="tab-${bu}" class="flex-1 min-w-[120px] px-3 py-2.5 whitespace-nowrap rounded-full text-sm font-bold shadow-sm transition-colors border">สาขา ${bu}</button>
    `).join('');
  } else {
    tabsContainer.style.display = 'none';
  }

  // Build warning if any day exceeds a comfortable number of stops
  buildTripWarning();

}

function buildTripWarning() {
  const warnEl = document.getElementById('trip-warning');
  const warnText = document.getElementById('trip-warning-text');
  const msgs = [];
  for (const bu in tripPlan) {
    tripPlan[bu].forEach((dayJobs, idx) => {
      if (dayJobs.length > MAX_ROUTE_CUSTOMER_STOPS) {
        msgs.push(`สาขา ${bu} วันที่ ${idx + 1} มี ${dayJobs.length} งาน ซึ่งอาจมากเกินไปสำหรับหนึ่งวัน`);
      }
    });
  }
  if (msgs.length) {
    warnText.innerText = msgs.join(' · ') + ' — แนะนำให้เพิ่มจำนวนวันหรือลบบางงาน';
    warnEl.classList.remove('hidden');
  } else {

  }

function routeKm(points) {
  let total = 0;
  for (let i = 0; i < points.length - 1; i++) {
    total += haversine(points[i].lat, points[i].lng, points[i+1].lat, points[i+1].lng);
  }
  return total;
}

function backToTrip() {
  document.getElementById('step-execution').classList.add('hidden');
  document.getElementById('step-trip').classList.remove('hidden');
  window.scrollTo(0, 0);
  // Re-render current branch to reflect progress
  const branches = Object.keys(tripPlan);
  showTripBranch(branches[0]);
}

/* ===== Map ===== */
function initMap(points) {
  try { if (leafletMap) { leafletMap.remove(); } } catch (e) {}
  leafletMap = null;
  const start = points[0];
  leafletMap = L.map('map', { zoomControl: false }).setView([start.lat, start.lng], 10);
  L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(leafletMap);

  const bounds = L.latLngBounds();
  const startIcon = L.divIcon({ html: `<div class="bg-blue-700 border-2 border-white w-5 h-5 rounded-full shadow-md"></div>`, className: '', iconSize: [20,20], iconAnchor: [10,10] });
  const stopIcon = (num) => L.divIcon({ html: `<div class="bg-white border-2 border-blue-600 text-blue-700 w-6 h-6 rounded-full flex justify-center items-center text-[10px] font-bold shadow-md">${num}</div>`, className: '', iconSize: [24,24], iconAnchor: [12,12] });

  points.forEach((p, i) => {
    const isStart = i === 0 || i === points.length - 1;
    const marker = L.marker([p.lat, p.lng], { icon: isStart ? startIcon : stopIcon(i) }).addTo(leafletMap);
    marker.bindPopup(isStart ? `<b>เริ่ม/สิ้นสุด:</b> ${p.name || 'สาขา'}` : `<b>จุดที่ ${i}:</b> ${p.name}`);
    bounds.extend([p.lat, p.lng]);
  });
  leafletMap.fitBounds(bounds, { padding: [30,30] });

  const coords = points.map(p => `${p.lng},${p.lat}`).join(';');
  fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`)
    .then(r => r.json())
    .then(data => { if (data.routes && data.routes[0]) L.geoJSON(data.routes[0].geometry, { style: { color:'#2563eb', weight:4, opacity:0.8, dashArray:'5,5' } }).addTo(leafletMap); })
    .catch(() => {});
}

/* ===== Check-in / Save ===== */
function getLocationAndSubmit(btn) {
  const form = btn.closest('form');
  const statusEl = form.querySelector('[name="status"]');
  if (!statusEl.value) {
    alert("กรุณาเลือกสถานะเข้าพบ");
    statusEl.focus();
    return;
  }
  const originalText = btn.innerHTML;
  btn.innerHTML = `<div class="animate-spin h-4 w-4 border-b-2 border-white rounded-full mr-2 inline-block"></div>กำลังหาตำแหน่ง...`;
  btn.disabled = true;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => submitForm(form, pos.coords.latitude, pos.coords.longitude, btn, originalText),
      err => { if (confirm("ไม่สามารถดึงตำแหน่ง GPS ได้ ต้องการบันทึกโดยไม่มีพิกัดหรือไม่?")) submitForm(form, '', '', btn, originalText); else { btn.innerHTML = originalText; btn.disabled = false; } },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  } else {
    submitForm(form, '', '', btn, originalText);
  }
}

function submitForm(form, lat, lng, btn, originalText) {
  btn.innerHTML = `<div class="animate-spin h-4 w-4 border-b-2 border-white rounded-full mr-2 inline-block"></div>กำลังบันทึก...`;
  const status = form.querySelector('[name="status"]').value;
  const note = form.querySelector('[name="note"]').value;
  const jId = form.dataset.id;
  const bu = form.dataset.bu;
  const dayNum = parseInt(form.dataset.day);
  const totalDays = (tripPlan[bu] || []).length;

  const d = new Date();
  const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;

  const payload = {
    "วันที่บันทึกระบบ": d.toISOString(),
    "วันที่ออกตลาด": dateStr,
    "ประเภทงาน": "แผนงาน KCE",
    "รหัสลูกค้า": jId,
    "BU/สังกัด": bu,
    "ละติจูด": lat,
    "ลองจิจูด": lng,
    "สถานะเข้าพบ": status,
    "หมายเหตุ": note,
    "trip_id": currentTripId,
    "day_number": dayNum,
    "total_days": totalDays
  };

  fetch(WEB_APP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => markDone(form, status, btn, originalText))
    .catch(e => {
      alert("บันทึกผิดพลาด: " + e.message);
      btn.innerHTML = originalText;
      btn.disabled = false;
    });
}

function markDone(form, status, btn, originalText) {
  const jId = form.dataset.id;
  const bu = form.dataset.bu;

  // Mark job done in state
  (tripPlan[bu] || []).forEach(day => day.forEach(j => { if (String(j.id) === String(jId)) j.done = true; }));

  btn.innerHTML = `<svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> บันทึกสำเร็จ`;
  btn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'active:bg-blue-800');
  btn.classList.add('bg-green-600', 'hover:bg-green-700');
  btn.disabled = false;

  const card = document.getElementById(`card-${jId}`);
  if (card) {
    card.classList.remove('bg-white'); card.classList.add('bg-green-50', 'border-green-200');
    const badge = document.createElement('div');
    badge.className = 'absolute top-3 right-3 bg-green-100 text-green-800 text-[10px] font-bold px-2 py-1 rounded shadow-sm border border-green-200 flex items-center z-10';
    badge.innerHTML = `<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ดำเนินการแล้ว`;
    card.appendChild(badge);
  }

  setTimeout(() => {
    btn.innerHTML = originalText;
    btn.classList.remove('bg-green-600', 'hover:bg-green-700');
    btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'active:bg-blue-800');
    btn.disabled = false;
  }, 4000);
}

window.onload = () => loadData();
</script>
</body>
</html>
